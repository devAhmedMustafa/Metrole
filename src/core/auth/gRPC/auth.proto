syntax = "proto3";

package auth;

option go_package = "metrole/src/core/auth/gRPC;authpb";


service AuthGrpc {
    rpc GoogleLogin (GoogleLoginRequest) returns (LoginResponse);
}

message GoogleLoginRequest {
    string idToken = 1;
}

message LoginResponse {
    string userId = 1;
    string token = 2;
}